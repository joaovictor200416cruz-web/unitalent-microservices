services:
  mysql:
    image: mysql:8.4
    container_name: unitalent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: unitalent
      MYSQL_PASSWORD: unitalent
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uunitalent", "-punitalent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
