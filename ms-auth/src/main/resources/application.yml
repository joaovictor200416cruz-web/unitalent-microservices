server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/unitalent_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: unitalent
    password: unitalent
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
